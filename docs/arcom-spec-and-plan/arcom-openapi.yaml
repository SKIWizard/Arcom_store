openapi: 3.0.3
info:
  title: arcom API
  version: 1.0.0
  description: |
    API магазина-витрины arcom: публичный каталог б/у техники, закрытая админка
    и импорт публикаций Telegram с обработкой через ИИ.

    Покупки, корзины, платежи и регистрация покупателей не предусмотрены.
    Клиенты связываются с продавцом по контактам из GET /site.

    Основной источник объявлений — Telegram; импорт асинхронный.
    Автопубликация допускается только после проверок достоверности полей.
    Никакие секреты Telegram/GigaChat через публичный API не передаются.
servers:
  - url: /api/v1
    description: API под тем же доменом (через reverse proxy)
tags:
  - name: Storefront
    description: Информация о магазине
  - name: Catalog
    description: Публичный каталог и товарные карточки
  - name: Admin Auth
    description: Авторизация единственного администратора
  - name: Admin Listings
    description: Управление объявлениями и фотографиями
  - name: Admin Imports
    description: Управление задачами ИИ-импорта
  - name: Admin Telegram
    description: Дополнительный импорт истории канала
  - name: Integrations
    description: Внутренние вызовы Telegram
  - name: System
    description: Проверка состояния сервиса

paths:
  /site:
    get:
      tags: [Storefront]
      operationId: getSiteSettings
      summary: Публичные контакты и информация о магазине
      responses:
        '200':
          description: Публичные настройки магазина
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Список доступных категорий с количеством активных товаров
      responses:
        '200':
          description: Категории каталога
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'

  /catalog/facets:
    get:
      tags: [Catalog]
      operationId: getCatalogFacets
      summary: Значения фильтров с учётом выбранных параметров
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
          description: Текст поиска для уточнения фильтров
      responses:
        '200':
          description: Доступные бренды, диапазон цен, объёмы памяти
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFacets'

  /listings:
    get:
      tags: [Catalog]
      operationId: searchListings
      summary: Поиск и фильтрация опубликованных объявлений
      description: |
        Показывает только объявления со статусом публикации PUBLISHED.
        По умолчанию — только товары в наличии (AVAILABLE).
        Запросы к этому методу не требуют регистрации.
      parameters:
        - name: q
          in: query
          description: Поиск по названию, бренду, модели и описанию
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/CategoryQuery'
        - name: brand
          in: query
          schema:
            type: string
            maxLength: 80
        - name: condition
          in: query
          schema:
            $ref: '#/components/schemas/Condition'
        - name: minPriceRub
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxPriceRub
          in: query
          schema:
            type: integer
            minimum: 0
        - name: storageGb
          in: query
          schema:
            type: integer
            minimum: 1
        - name: ramGb
          in: query
          schema:
            type: integer
            minimum: 1
        - name: availability
          in: query
          description: ANY включает в том числе проданные объявления
          schema:
            type: string
            enum: [AVAILABLE, RESERVED, SOLD, ANY]
            default: AVAILABLE
        - name: sort
          in: query
          schema:
            type: string
            enum: [NEWEST, PRICE_ASC, PRICE_DESC]
            default: NEWEST
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Страница объявлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /listings/{slug}:
    get:
      tags: [Catalog]
      operationId: getListingBySlug
      summary: Полная страница опубликованного объявления
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Объявление, включая фото и характеристики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /listings/{slug}/related:
    get:
      tags: [Catalog]
      operationId: getRelatedListings
      summary: Похожие товары, исключая текущий
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 4
      responses:
        '200':
          description: Подборка похожих объявлений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/auth/csrf:
    get:
      tags: [Admin Auth]
      operationId: getCsrfToken
      summary: Получить CSRF-токен для входа и изменения данных
      description: |
        Браузер обращается с credentials: include. Сервер создаёт сессию
        (если нужно) и возвращает CSRF-токен. На изменяющие запросы
        браузер передаёт X-CSRF-TOKEN и cookie JSESSIONID.
      responses:
        '200':
          description: CSRF-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'

  /admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Войти в админку
      security:
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен; сервер установил HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/auth/me:
    get:
      tags: [Admin Auth]
      operationId: getCurrentAdmin
      summary: Проверить текущую сессию администратора
      security:
        - AdminSession: []
      responses:
        '200':
          description: Данные администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: adminLogout
      summary: Завершить админскую сессию
      security:
        - AdminSession: []
          CsrfToken: []
      responses:
        '204':
          description: Сессия закрыта
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/listings:
    get:
      tags: [Admin Listings]
      operationId: listAdminListings
      summary: Все объявления для управления, включая черновики и архив
      security:
        - AdminSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: publicationStatus
          in: query
          schema:
            $ref: '#/components/schemas/PublicationStatus'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/ListingSource'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Страница объявлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin Listings]
      operationId: createListing
      summary: Создать объявление вручную
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Создан черновик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/listings/{id}:
    parameters:
      - $ref: '#/components/parameters/ListingIdPath'
    get:
      tags: [Admin Listings]
      operationId: getAdminListing
      summary: Получить объявление с исходным постом и служебными данными
      security:
        - AdminSession: []
      responses:
        '200':
          description: Объявление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin Listings]
      operationId: updateListing
      summary: Частично изменить объявление
      description: |
        Присутствующие в запросе поля заменяются; отсутствующие не меняются.
        Изменённые вручную поля добавляются в protectedFields, чтобы
        последующие изменения Telegram-поста не затёрли правки владельца.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Обновлённое объявление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Listings]
      operationId: archiveListing
      summary: Архивировать объявление без физического удаления
      security:
        - AdminSession: []
          CsrfToken: []
      responses:
        '204':
          description: Скрыто из публичного каталога
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/listings/{id}/publish:
    post:
      tags: [Admin Listings]
      operationId: publishListing
      summary: Опубликовать валидный черновик
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
      responses:
        '200':
          description: Опубликованное объявление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/listings/{id}/unpublish:
    post:
      tags: [Admin Listings]
      operationId: unpublishListing
      summary: Снять объявление с публикации, оставив его черновиком
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/listings/{id}/availability:
    put:
      tags: [Admin Listings]
      operationId: setListingAvailability
      summary: Отметить товар как доступный, забронированный или проданный
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [availability]
              properties:
                availability:
                  $ref: '#/components/schemas/Availability'
      responses:
        '200':
          description: Обновлённое объявление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/listings/{id}/images:
    post:
      tags: [Admin Listings]
      operationId: uploadListingImages
      summary: Загрузить фотографии к объявлению
      description: |
        Проверять MIME по содержимому, размеры и количество на сервере.
        Сервер преобразует фото в оптимизированные форматы и сохраняет в S3.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Загруженные изображения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /admin/listings/{id}/images/order:
    put:
      tags: [Admin Listings]
      operationId: reorderListingImages
      summary: Указать порядок изображений (первое — обложка)
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  description: Все текущие ID изображений без повторов
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Новый порядок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImage'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/listings/{id}/images/{imageId}:
    delete:
      tags: [Admin Listings]
      operationId: deleteListingImage
      summary: Удалить фотографию объявления
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/ListingIdPath'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Изображение удалено
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/import-jobs:
    get:
      tags: [Admin Imports]
      operationId: listImportJobs
      summary: Журнал импорта с фильтром на требующие проверки
      security:
        - AdminSession: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Журнал импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobPage'

  /admin/import-jobs/{jobId}:
    get:
      tags: [Admin Imports]
      operationId: getImportJob
      summary: Оригинал сообщения, вывод ИИ, ошибки и предлагаемый товар
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Детали задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/import-jobs/{jobId}/approve:
    post:
      tags: [Admin Imports]
      operationId: approveImportJob
      summary: Подтвердить импорт и опубликовать объявление
      description: |
        Для задач REVIEW_REQUIRED. При необходимости администратор
        корректирует поля в теле запроса перед публикацией.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Готовое опубликованное объявление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListing'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/import-jobs/{jobId}/ignore:
    post:
      tags: [Admin Imports]
      operationId: ignoreImportJob
      summary: Отклонить предложенное объявление
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Задача помечена IGNORED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/import-jobs/{jobId}/retry:
    post:
      tags: [Admin Imports]
      operationId: retryImportJob
      summary: Повторно обработать импорт после ошибки
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '202':
          description: Отправлено на повторную обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/telegram/backfills:
    post:
      tags: [Admin Telegram]
      operationId: requestTelegramBackfill
      summary: Запустить импорт старых постов через MTProto-клиент
      description: |
        Не использует Bot API: требуется отдельно настроенный Telethon worker
        с разрешённым доступом к каналу. Функция необязательна для MVP.
        Дубликаты определяются по (channelId, messageId).
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '202':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillJob'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/telegram/backfills/{backfillId}:
    get:
      tags: [Admin Telegram]
      operationId: getTelegramBackfill
      summary: Прогресс импорта истории
      security:
        - AdminSession: []
      parameters:
        - name: backfillId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статистика импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/site:
    patch:
      tags: [Storefront]
      operationId: updateSiteSettings
      summary: Изменить публичные контакты и настройки магазина
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteSettingsRequest'
      responses:
        '200':
          description: Настройки обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /integrations/telegram/webhook:
    post:
      tags: [Integrations]
      operationId: acceptTelegramUpdate
      summary: Принять новый/изменённый пост Telegram
      description: |
        Вебхук регистрируется сервером через setWebhook с allowed_updates:
        [channel_post, edited_channel_post]. Секретный заголовок задаётся
        параметром secret_token при регистрации вебхука. Сверять также
        chat.id с разрешённым каналом. Ответить 200 быстро, импорт делать
        асинхронно. Сохранять update_id для идемпотентности. Сообщения
        одного media_group_id собирать в альбом до обработки.
      security:
        - TelegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
      responses:
        '200':
          description: Обновление получено либо уже было обработано
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health:
    get:
      tags: [System]
      operationId: healthcheck
      summary: Liveness; без приватной диагностической информации
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Secure + HttpOnly + SameSite=Lax; только для администратора
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Значение из GET /admin/auth/csrf для изменяющих операций
    TelegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Секрет из Telegram setWebhook(secret_token)

  parameters:
    CategoryQuery:
      name: category
      in: query
      schema:
        $ref: '#/components/schemas/Category'
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 60
        default: 20
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: iphone-13-128gb-f4a1
    ListingIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Ошибка параметров или валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Требуется действительная авторизация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Запрещено, включая отсутствующий/неверный CSRF-токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Конфликт статуса, повторная операция или неготовность к публикации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Не хватает обязательных проверенных данных для публикации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Слишком большой файл
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Не настроен или временно недоступен worker истории
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Некорректная цена
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    Category:
      type: string
      description: Категории магазина; отображаемые русские названия — на клиенте
      enum: [SMARTPHONE, ACCESSORY, LAPTOP, DESKTOP, TABLET, OTHER]
    Condition:
      type: string
      enum: [NEW, USED, REFURBISHED]
    Availability:
      type: string
      enum: [AVAILABLE, RESERVED, SOLD]
    PublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    ListingSource:
      type: string
      enum: [MANUAL, TELEGRAM]
    ImportStatus:
      type: string
      enum: [QUEUED, PROCESSING, REVIEW_REQUIRED, PUBLISHED, IGNORED, FAILED]

    CategorySummary:
      type: object
      required: [code, label, activeCount]
      properties:
        code:
          $ref: '#/components/schemas/Category'
        label:
          type: string
          example: Смартфоны
        activeCount:
          type: integer
          minimum: 0

    SiteSettings:
      type: object
      required: [name, phone, telegramUrl, heroTitle, heroSubtitle]
      properties:
        name:
          type: string
          example: arcom
        tagline:
          type: string
          example: Техника, которую хочется забрать
        heroTitle:
          type: string
          example: Твоя следующая техника — здесь
        heroSubtitle:
          type: string
          example: Проверенные смартфоны, ноутбуки и аксессуары
        phone:
          type: string
          description: Международный номер для tel-ссылки
          example: '+79990000000'
        telegramUrl:
          type: string
          format: uri
          example: https://t.me/arcom_manager
        telegramChannelUrl:
          type: string
          format: uri
          example: https://t.me/arcom_shop
        avitoUrl:
          type: string
          format: uri
          nullable: true
        whatsappUrl:
          type: string
          format: uri
          nullable: true
        city:
          type: string
          nullable: true
          example: Москва
        address:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        logoUrl:
          type: string
          format: uri
          nullable: true
        updatedAt:
          type: string
          format: date-time

    UpdateSiteSettingsRequest:
      type: object
      description: Все свойства необязательны; меняются только переданные
      additionalProperties: false
      properties:
        tagline:
          type: string
          maxLength: 160
        heroTitle:
          type: string
          maxLength: 120
        heroSubtitle:
          type: string
          maxLength: 320
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        telegramUrl:
          type: string
          format: uri
        telegramChannelUrl:
          type: string
          format: uri
        avitoUrl:
          type: string
          format: uri
          nullable: true
        whatsappUrl:
          type: string
          format: uri
          nullable: true
        city:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        logoUrl:
          type: string
          format: uri
          nullable: true

    ListingImage:
      type: object
      required: [id, url, thumbnailUrl, sortOrder, width, height]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Собственная публичная ссылка на оптимизированное изображение
        thumbnailUrl:
          type: string
          format: uri
        alt:
          type: string
          example: iPhone 13, вид спереди
        sortOrder:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    ListingSpecs:
      type: object
      description: |
        Неизвестные характеристики оставлять пустыми, не выдумывать.
        Значения, требующие точности, берутся из текста или проверенных
        вручную данных, а не предполагаются по названию модели.
      additionalProperties: false
      properties:
        storageGb:
          type: integer
          minimum: 1
          nullable: true
        ramGb:
          type: integer
          minimum: 1
          nullable: true
        batteryHealthPercent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        color:
          type: string
          maxLength: 80
          nullable: true
        processor:
          type: string
          maxLength: 160
          nullable: true
        screenSizeInches:
          type: number
          format: float
          minimum: 1
          nullable: true
        defects:
          type: string
          maxLength: 1200
          nullable: true
        includedAccessories:
          type: string
          maxLength: 1200
          nullable: true
        extra:
          type: object
          description: Нестандартные проверенные текстовые характеристики
          additionalProperties:
            type: string

    ListingCard:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - priceRub
        - currency
        - condition
        - availability
        - images
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: iphone-13-128gb-f4a1
        title:
          type: string
          example: Apple iPhone 13 128 ГБ
        brand:
          type: string
          nullable: true
          example: Apple
        model:
          type: string
          nullable: true
          example: iPhone 13
        category:
          $ref: '#/components/schemas/Category'
        priceRub:
          type: integer
          minimum: 1
          example: 24990
        currency:
          type: string
          enum: [RUB]
        condition:
          $ref: '#/components/schemas/Condition'
        availability:
          $ref: '#/components/schemas/Availability'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImage'
        specs:
          $ref: '#/components/schemas/ListingSpecs'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/ListingCard'
        - type: object
          required: [description, updatedAt, source]
          properties:
            description:
              type: string
              example: Состояние отличное, Face ID работает, аккумулятор 88%.
            source:
              $ref: '#/components/schemas/ListingSource'
            sourcePostUrl:
              type: string
              format: uri
              nullable: true
              description: Ссылка на исходный пост при публичном канале
            updatedAt:
              type: string
              format: date-time

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ListingPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListingCard'
        meta:
          $ref: '#/components/schemas/PageMeta'

    CatalogFacets:
      type: object
      required: [brands, storageOptionsGb, ramOptionsGb, priceRangeRub]
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        storageOptionsGb:
          type: array
          items:
            type: integer
        ramOptionsGb:
          type: array
          items:
            type: integer
        priceRangeRub:
          type: object
          required: [min, max]
          properties:
            min:
              type: integer
              minimum: 0
            max:
              type: integer
              minimum: 0

    FacetValue:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0

    CsrfResponse:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1

    AdminProfile:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
        displayName:
          type: string
          example: Владелец arcom

    CreateListingRequest:
      type: object
      description: Создаётся черновик; изображения затем добавляются через upload
      additionalProperties: false
      required: [title, category, priceRub, condition]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 180
        description:
          type: string
          maxLength: 10000
          default: ''
        brand:
          type: string
          maxLength: 80
          nullable: true
        model:
          type: string
          maxLength: 120
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        priceRub:
          type: integer
          minimum: 1
        condition:
          $ref: '#/components/schemas/Condition'
        availability:
          $ref: '#/components/schemas/Availability'
        specs:
          $ref: '#/components/schemas/ListingSpecs'

    UpdateListingRequest:
      type: object
      description: |
        Для PATCH все поля необязательны. Поля изменённые администратором,
        автоматически защищаются от последующего перезаписывания импортом.
        Для сброса защиты есть явный список protectedFields.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 180
        description:
          type: string
          maxLength: 10000
        brand:
          type: string
          maxLength: 80
          nullable: true
        model:
          type: string
          maxLength: 120
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        priceRub:
          type: integer
          minimum: 1
        condition:
          $ref: '#/components/schemas/Condition'
        availability:
          $ref: '#/components/schemas/Availability'
        specs:
          $ref: '#/components/schemas/ListingSpecs'
        protectedFields:
          type: array
          uniqueItems: true
          description: Полный набор защищённых полей (если передан)
          items:
            type: string
            enum:
              - title
              - description
              - brand
              - model
              - category
              - priceRub
              - condition
              - specs

    TelegramSource:
      type: object
      required: [chatId, messageId]
      properties:
        chatId:
          type: integer
          format: int64
          description: Telegram chat.id, обычно отрицательный для канала
        messageId:
          type: integer
          format: int64
        mediaGroupId:
          type: string
          nullable: true
        messageUrl:
          type: string
          format: uri
          nullable: true
        messageDate:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true

    AdminListing:
      allOf:
        - $ref: '#/components/schemas/ListingDetail'
        - type: object
          required: [publicationStatus, protectedFields]
          properties:
            publicationStatus:
              $ref: '#/components/schemas/PublicationStatus'
            telegramSource:
              $ref: '#/components/schemas/TelegramSource'
            importJobId:
              type: string
              format: uuid
              nullable: true
            rawSourceText:
              type: string
              nullable: true
              description: Оригинал поста для аудита, не отдавать в публичном API
            protectedFields:
              type: array
              uniqueItems: true
              items:
                type: string
            aiConfidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
              nullable: true

    AdminListingPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminListing'
        meta:
          $ref: '#/components/schemas/PageMeta'

    SaleClassification:
      type: string
      enum: [SALE, NOT_SALE, UNCERTAIN]

    AiExtraction:
      type: object
      description: Результат GigaChat с json_schema; всегда проверяется сервером
      required: [classification, confidence, warnings, missingFields]
      properties:
        classification:
          $ref: '#/components/schemas/SaleClassification'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        explanation:
          type: string
          description: Короткое объяснение решения без скрытых рассуждений
        warnings:
          type: array
          items:
            type: string
        missingFields:
          type: array
          items:
            type: string
        detectedCurrency:
          type: string
          nullable: true
        modelName:
          type: string
          nullable: true

    ListingCandidate:
      type: object
      description: |
        Предварительно извлечённые поля. В отличие от публичного товара,
        цена, название и категория могут отсутствовать. Не публиковать как есть.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category:
          allOf:
            - $ref: '#/components/schemas/Category'
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        priceRub:
          type: integer
          minimum: 1
          nullable: true
        condition:
          allOf:
            - $ref: '#/components/schemas/Condition'
          nullable: true
        specs:
          $ref: '#/components/schemas/ListingSpecs'
        imageUrls:
          type: array
          description: Ссылки на уже сохранённые собственные изображения
          items:
            type: string
            format: uri

    ImportJob:
      type: object
      required: [id, status, telegramSource, originalText, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        telegramSource:
          $ref: '#/components/schemas/TelegramSource'
        originalText:
          type: string
        candidate:
          $ref: '#/components/schemas/ListingCandidate'
        ai:
          $ref: '#/components/schemas/AiExtraction'
        listingId:
          type: string
          format: uuid
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        retryCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    ImportJobPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        meta:
          $ref: '#/components/schemas/PageMeta'

    BackfillRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 300
          description: Максимум постов для просмотра, начиная с новых
        since:
          type: string
          format: date-time
          nullable: true
        dryRun:
          type: boolean
          default: false
          description: Оценка постов без публикации

    BackfillJob:
      type: object
      required: [id, status, scanned, imported, skipped]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        scanned:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    TelegramUpdate:
      type: object
      description: |
        Оригинальный объект Telegram Update. Telegram постоянно добавляет
        поля; сохранять payload целиком и обрабатывать channel_post и
        edited_channel_post. Не использовать схему как способ защиты —
        секрет и chat.id проверяются отдельно.
      required: [update_id]
      properties:
        update_id:
          type: integer
          format: int64
        channel_post:
          type: object
          additionalProperties: true
        edited_channel_post:
          type: object
          additionalProperties: true
      additionalProperties: true
